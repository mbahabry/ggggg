services:
  db:
    image: postgres:16-alpine
    container_name: fleetview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_password
      POSTGRES_DB: fleetdb
    ports:
      - "5432:5432"
    volumes:
      - fleetview_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleetdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fleetview_pgdata:
